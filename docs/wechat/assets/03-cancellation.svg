<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1272" viewBox="0 0 1080 1272">
<rect width="1080" height="1272" fill="#f4f7fa"/>
<text x="60" y="42" font-family="Noto Sans CJK SC, sans-serif" font-size="25" dominant-baseline="text-before-edge" fill="#007e87">VOXASTAGE  /  实时数字人，从模型到交互</text>
<text x="60" y="100" font-family="Noto Sans CJK SC, sans-serif" font-size="46" dominant-baseline="text-before-edge" fill="#163044">一次打断，四处都要响应</text>
<text x="60" y="168" font-family="Noto Sans CJK SC, sans-serif" font-size="30" dominant-baseline="text-before-edge" fill="#476579">示意顺序；具体操作可异步发生</text>
<rect x="55" y="235" width="970" height="195" rx="20" fill="#ffffff" stroke="#d9e4eb" stroke-width="2"/>
<rect x="55" y="235" width="8" height="195" rx="20" fill="#007e87" stroke="#007e87" stroke-width="2"/>
<text x="88" y="259" font-family="Noto Sans CJK SC, sans-serif" font-size="38" dominant-baseline="text-before-edge" fill="#007e87">播放端</text>
<text x="88" y="318" font-family="Noto Sans CJK SC, sans-serif" font-size="36" dominant-baseline="text-before-edge" fill="#163044">停止旧音源，清空音画队列</text>
<text x="88" y="366" font-family="Noto Sans CJK SC, sans-serif" font-size="36" dominant-baseline="text-before-edge" fill="#163044">让旧帧不能再次显示</text>
<path d="M540 435v32m-10 -9l10 15 10 -15" stroke="#007e87" stroke-width="4" fill="none"/>
<rect x="55" y="473" width="970" height="195" rx="20" fill="#ffffff" stroke="#d9e4eb" stroke-width="2"/>
<rect x="55" y="473" width="8" height="195" rx="20" fill="#007e87" stroke="#007e87" stroke-width="2"/>
<text x="88" y="497" font-family="Noto Sans CJK SC, sans-serif" font-size="38" dominant-baseline="text-before-edge" fill="#007e87">任务端</text>
<text x="88" y="556" font-family="Noto Sans CJK SC, sans-serif" font-size="36" dominant-baseline="text-before-edge" fill="#163044">使旧话轮失效并发起取消</text>
<text x="88" y="604" font-family="Noto Sans CJK SC, sans-serif" font-size="36" dominant-baseline="text-before-edge" fill="#163044">避免把协程取消当成硬件停算</text>
<path d="M540 673v32m-10 -9l10 15 10 -15" stroke="#007e87" stroke-width="4" fill="none"/>
<rect x="55" y="711" width="970" height="195" rx="20" fill="#ffffff" stroke="#d9e4eb" stroke-width="2"/>
<rect x="55" y="711" width="8" height="195" rx="20" fill="#007e87" stroke="#007e87" stroke-width="2"/>
<text x="88" y="735" font-family="Noto Sans CJK SC, sans-serif" font-size="38" dominant-baseline="text-before-edge" fill="#007e87">结果入口</text>
<text x="88" y="794" font-family="Noto Sans CJK SC, sans-serif" font-size="36" dominant-baseline="text-before-edge" fill="#163044">工具与媒体返回时检查归属</text>
<text x="88" y="842" font-family="Noto Sans CJK SC, sans-serif" font-size="36" dominant-baseline="text-before-edge" fill="#163044">拒绝已经失效的话轮结果</text>
<path d="M540 911v32m-10 -9l10 15 10 -15" stroke="#007e87" stroke-width="4" fill="none"/>
<rect x="55" y="949" width="970" height="195" rx="20" fill="#ffffff" stroke="#d9e4eb" stroke-width="2"/>
<rect x="55" y="949" width="8" height="195" rx="20" fill="#007e87" stroke="#007e87" stroke-width="2"/>
<text x="88" y="973" font-family="Noto Sans CJK SC, sans-serif" font-size="38" dominant-baseline="text-before-edge" fill="#007e87">历史上下文</text>
<text x="88" y="1032" font-family="Noto Sans CJK SC, sans-serif" font-size="36" dominant-baseline="text-before-edge" fill="#163044">核对完整片段的播放确认</text>
<text x="88" y="1080" font-family="Noto Sans CJK SC, sans-serif" font-size="36" dominant-baseline="text-before-edge" fill="#163044">保留已播部分，标记中断</text>
<text x="60" y="1217" font-family="Noto Sans CJK SC, sans-serif" font-size="27" dominant-baseline="text-before-edge" fill="#476579">这里描述有效打断后的处理；不宣称已解决语义打断。</text>
</svg>
