<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1034" viewBox="0 0 1080 1034">
<rect width="1080" height="1034" fill="#f4f7fa"/>
<text x="60" y="42" font-family="Noto Sans CJK SC, sans-serif" font-size="25" dominant-baseline="text-before-edge" fill="#007e87">VOXASTAGE  /  实时数字人，从模型到交互</text>
<text x="60" y="100" font-family="Noto Sans CJK SC, sans-serif" font-size="46" dominant-baseline="text-before-edge" fill="#163044">一个数字人的三层职责</text>
<text x="60" y="168" font-family="Noto Sans CJK SC, sans-serif" font-size="30" dominant-baseline="text-before-edge" fill="#476579">职责示意；编排层协调另外两层</text>
<rect x="55" y="235" width="970" height="195" rx="20" fill="#ffffff" stroke="#d9e4eb" stroke-width="2"/>
<rect x="55" y="235" width="8" height="195" rx="20" fill="#007e87" stroke="#007e87" stroke-width="2"/>
<text x="88" y="259" font-family="Noto Sans CJK SC, sans-serif" font-size="38" dominant-baseline="text-before-edge" fill="#007e87">01 / 对话后端</text>
<text x="88" y="318" font-family="Noto Sans CJK SC, sans-serif" font-size="36" dominant-baseline="text-before-edge" fill="#163044">ASR → LLM → TTS / MiniCPM-o</text>
<text x="88" y="366" font-family="Noto Sans CJK SC, sans-serif" font-size="36" dominant-baseline="text-before-edge" fill="#163044">理解输入，组织回答，产生声音</text>
<rect x="55" y="473" width="970" height="195" rx="20" fill="#ffffff" stroke="#d9e4eb" stroke-width="2"/>
<rect x="55" y="473" width="8" height="195" rx="20" fill="#007e87" stroke="#007e87" stroke-width="2"/>
<text x="88" y="497" font-family="Noto Sans CJK SC, sans-serif" font-size="38" dominant-baseline="text-before-edge" fill="#007e87">02 / 会话与 Agent 编排</text>
<text x="88" y="556" font-family="Noto Sans CJK SC, sans-serif" font-size="36" dominant-baseline="text-before-edge" fill="#163044">工具执行、话轮切换、上下文</text>
<text x="88" y="604" font-family="Noto Sans CJK SC, sans-serif" font-size="36" dominant-baseline="text-before-edge" fill="#163044">判断任务是否仍属于有效话轮</text>
<rect x="55" y="711" width="970" height="195" rx="20" fill="#ffffff" stroke="#d9e4eb" stroke-width="2"/>
<rect x="55" y="711" width="8" height="195" rx="20" fill="#007e87" stroke="#007e87" stroke-width="2"/>
<text x="88" y="735" font-family="Noto Sans CJK SC, sans-serif" font-size="38" dominant-baseline="text-before-edge" fill="#007e87">03 / 形象与浏览器播放</text>
<text x="88" y="794" font-family="Noto Sans CJK SC, sans-serif" font-size="36" dominant-baseline="text-before-edge" fill="#163044">DINet / FlashHead / StreamingTalker</text>
<text x="88" y="842" font-family="Noto Sans CJK SC, sans-serif" font-size="36" dominant-baseline="text-before-edge" fill="#163044">视频或网格跟随音频播放时钟</text>
<text x="60" y="979" font-family="Noto Sans CJK SC, sans-serif" font-size="27" dominant-baseline="text-before-edge" fill="#476579">模型能力来自上游；适配、生命周期与验证来自本项目。</text>
</svg>
