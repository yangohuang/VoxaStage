    <g font-size="11" fill="#6ce1c6" letter-spacing="2"><text x="80" y="238">01 / UNDERSTAND</text><text x="448" y="238">02 / ORCHESTRATE</text><text x="844" y="238">03 / EMBODY</text></g>
