    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102b32"/><stop offset="1" stop-color="#08151e"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#6ce1c6"/><stop offset="1" stop-color="#87b9fa"/></linearGradient>
  </defs>
  <rect width="1200" height="390" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#36535e" opacity=".3"><circle cx="1080" cy="55" r="150"/><circle cx="1080" cy="55" r="210"/><path d="M0 300H1200M0 330H1200M0 360H1200"/></g>
