<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">VoxaStage — Voice, intelligence, presence</title>
  <desc id="desc">Local-first voice agents with cascaded and end-to-end speech backends, interruptible orchestration, and 2D or 3D avatar output. Conceptual architecture, not a product screenshot.</desc>
