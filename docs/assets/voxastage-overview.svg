    <text x="55" y="125" fill="#f4f7f7" font-size="62" font-weight="700" letter-spacing="-2">VoxaStage</text>
    <text x="58" y="163" fill="#b2c7cf" font-size="20">Voice. Intelligence. Presence.</text>
