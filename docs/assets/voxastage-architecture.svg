<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1460" viewBox="0 0 1400 1460" role="img" aria-labelledby="title desc">
<title id="title">VoxaStage 系统架构</title><desc id="desc">浏览器输入经 Pipecat 会话层进入级联或 MiniCPM-o 端到端后端，再经媒体适配驱动 DINet、FlashHead 或 StreamingTalker。浏览器统一音画播放并回传语句播放确认。</desc>
